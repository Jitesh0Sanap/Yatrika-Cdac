services:
  hotel-logging-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hotel-logging-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - hotel-logging-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  hotel-logging-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-logging-api
    depends_on:
      hotel-logging-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__HotelLoggingDB: "Server=hotel-logging-db,1433;Database=HotelLoggingDB;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
    ports:
      - "8080:8080"

volumes:
  hotel-logging-db-data:
